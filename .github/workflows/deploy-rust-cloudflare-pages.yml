name: Continuous Deployment - Rust + Cloudflare Pages

on:
  workflow_call:
    inputs:
      system-packages:
        description: "Space-separated apt package names required for the build. Leave empty when none are needed."
        type: string
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  trunk-build:
    uses: ./.github/workflows/build-rust-trunk.yml
    with:
      system-packages: ${{ inputs.system-packages }}

  deployment:
    needs: trunk-build
    runs-on: ubuntu-latest
    steps:
      

      - name: Download Trunk output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v6.0.0
        with:
          name: trunk-dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ github.event.repository.name }} --branch=${{ github.ref_name }}
