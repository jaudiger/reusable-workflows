name: Continuous Integration - Static Analysis (Rust)

on:
  workflow_call:
    inputs:
      target:
        description: "Rust target triple used for compilation or Clippy."
        type: string
        default: ""
      features:
        description: "Comma or space-separated Cargo feature names to enable."
        type: string
        default: ""
      no-default-features:
        description: "Whether to disable Cargo default features."
        type: boolean
        default: false
      all-features:
        description: "Whether to enable all Cargo features. Set false to use default or selected features."
        type: boolean
        default: true
      system-packages:
        description: "Space-separated apt package names required for the build. Leave empty when none are needed."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  rust-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: "rustfmt"

      - name: Check formatting
        run: cargo fmt --all -- --check

  rust-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, nightly]
    continue-on-error: ${{ matrix.toolchain == 'nightly' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system packages
        if: inputs.system-packages != ''
        env:
          PKGS: ${{ inputs.system-packages }}
        run: |
          read -ra PKG_ARR <<< "$PKGS"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${PKG_ARR[@]}"

      - name: Install Rust (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: "clippy"
          targets: ${{ inputs.target }}

      - name: Cache cargo registry + build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/bin
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            target
          key: rust-static-analysis-${{ matrix.toolchain }}-${{ inputs.target || 'host' }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-static-analysis-${{ matrix.toolchain }}-${{ inputs.target || 'host' }}-

      - name: Check linting
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          FEATURES: ${{ inputs.features }}
          NO_DEFAULT_FEATURES: ${{ inputs.no-default-features }}
          ALL_FEATURES: ${{ inputs.all-features }}
        run: |
          set -euo pipefail
          if [[ "$ALL_FEATURES" == "true" && ( -n "$FEATURES" || "$NO_DEFAULT_FEATURES" == "true" ) ]]; then
            printf '%s\n' 'all-features cannot be combined with features or no-default-features.' >&2
            exit 1
          fi
          args=(--locked --all-targets)
          if [[ -n "$TARGET" ]]; then
            args+=(--target "$TARGET")
          fi
          if [[ "$ALL_FEATURES" == "true" ]]; then
            args+=(--all-features)
          else
            if [[ "$NO_DEFAULT_FEATURES" == "true" ]]; then
              args+=(--no-default-features)
            fi
            if [[ -n "$FEATURES" ]]; then
              normalized_features=${FEATURES//,/ }
              read -r -a feature_list <<< "$normalized_features"
              if ((${#feature_list[@]} > 0)); then
                feature_csv=$(IFS=,; printf '%s' "${feature_list[*]}")
                args+=(--features "$feature_csv")
              fi
            fi
          fi
          cargo clippy "${args[@]}" -- -D warnings
