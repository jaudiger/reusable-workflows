name: Continuous Integration - Tests (Rust)

on:
  workflow_call:
    inputs:
      enable-benchmarks:
        description: "Whether to run the additional benchmark job with all Cargo features."
        type: boolean
        default: false
      system-packages:
        description: "Space-separated apt package names required for the build. Leave empty when none are needed."
        type: string
        default: ""

permissions:
  contents: read

env:
  CODE_COVERAGE_REPORT_FOLDER: target/coverage
  CODE_COVERAGE_REPORT_FILE: report.xml

jobs:
  rust-benchmark-tests:
    if: inputs.enable-benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system packages
        if: inputs.system-packages != ''
        env:
          PKGS: ${{ inputs.system-packages }}
        run: |
          read -ra PKG_ARR <<< "$PKGS"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${PKG_ARR[@]}"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Cache cargo registry + build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/bin
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            target
          key: rust-benchmark-tests-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-benchmark-tests-

      - name: Run benchmarks
        run: cargo bench --locked --all-features

  rust-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system packages
        if: inputs.system-packages != ''
        env:
          PKGS: ${{ inputs.system-packages }}
        run: |
          read -ra PKG_ARR <<< "$PKGS"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${PKG_ARR[@]}"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install Brioche
        uses: brioche-dev/setup-brioche@9b82d4ee697500f7d81f6397a943935ffa3d887b # v1.5.0

      - name: Install cargo-llvm-cov
        run: brioche install -r cargo_llvm_cov

      - name: Cache cargo registry + build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/bin
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            target
          key: rust-unit-tests-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-unit-tests-

      - name: Run tests and generate coverage reports
        run: |
          mkdir -p ${{ env.CODE_COVERAGE_REPORT_FOLDER }}
          cargo llvm-cov --locked --workspace --all-features --cobertura --output-path ${{ env.CODE_COVERAGE_REPORT_FOLDER }}/${{ env.CODE_COVERAGE_REPORT_FILE }}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            ${{ env.CODE_COVERAGE_REPORT_FOLDER }}/${{ env.CODE_COVERAGE_REPORT_FILE }}
          retention-days: 7

      - name: Generate coverage summary
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: ${{ env.CODE_COVERAGE_REPORT_FOLDER }}/${{ env.CODE_COVERAGE_REPORT_FILE }}
          indicators: false
